<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChairMatch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 body{background:#0f1115;color:#f3f4f6;font-family:ui-sans-serif,system-ui}
 .card{position:absolute;inset:0;border-radius:1.25rem;overflow:hidden;background:#1b1f27;box-shadow:0 20px 60px rgba(0,0,0,.5);touch-action:none;user-select:none;transition:transform .25s ease, opacity .25s}
 .card.drag{transition:none}
 .stamp{position:absolute;top:1.5rem;padding:.25rem .75rem;border:4px solid;border-radius:.5rem;font-weight:900;font-size:1.75rem;transform:rotate(-12deg);opacity:0}
 .like{left:1.25rem;color:#34d399;border-color:#34d399}.nope{right:1.25rem;color:#f87171;border-color:#f87171;transform:rotate(12deg)}
 .leaflet-container{background:#1b1f27}
 .dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
 .chip{font-size:.72rem;padding:.2rem .55rem;border-radius:999px;background:#2a2f3a}
 input,select{background:#1b1f27;border:1px solid #2a2f3a;border-radius:.6rem;padding:.5rem .7rem;width:100%}
 label{font-size:.78rem;color:#9ca3af}
</style></head>
<body class="min-h-screen">
<header class="flex items-center justify-between px-5 py-3 border-b border-white/5">
 <div class="flex items-center gap-2"><span class="text-2xl">🪑</span><span class="font-black tracking-tight text-lg">ChairMatch</span><span class="chip ml-2" id="ranker">…</span></div>
 <nav class="flex gap-3 text-sm"><button data-view="profile" class="nav">Profile</button><button data-view="swipe" class="nav">Swipe</button><button data-view="matches" class="nav">Matches <span id="mcount" class="chip">0</span></button></nav>
</header>

<main id="profile" class="view max-w-xl mx-auto p-5">
 <h1 class="text-3xl font-black mb-1">Find a chair.</h1>
 <p class="text-gray-400 mb-5 text-sm">Real London homes, rents at <span id="rentmonth"></span> levels. Tell us what you want and what a landlord will see.</p>
 <form id="pform" class="grid grid-cols-2 gap-3">
  <div class="col-span-2"><label>Your name</label><input name="name" value="Ahmed"></div>
  <div><label>Monthly budget (£)</label><input name="budget" type="number" value="1900"></div>
  <div><label>Bedrooms</label><select name="bedrooms"><option value="0">Studio</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select></div>
  <div><label>Work postcode</label><input name="work_postcode" value="E2 7DG"></div>
  <div><label>Max commute (km, straight line)</label><input name="max_commute_km" type="number" value="8"></div>
  <div class="col-span-2 mt-2 text-xs uppercase tracking-wide text-gray-500">What matters to you (0–5)</div>
  <div><label>Transport</label><input name="w_transport" type="range" min="0" max="5" value="4"></div>
  <div><label>Safety</label><input name="w_safety" type="range" min="0" max="5" value="3"></div>
  <div><label>Green & quiet</label><input name="w_green" type="range" min="0" max="5" value="2"></div>
  <div><label>Energy bills (EPC)</label><input name="w_energy" type="range" min="0" max="5" value="2"></div>
  <div class="col-span-2 mt-2 text-xs uppercase tracking-wide text-gray-500">What the landlord's rules check</div>
  <div><label>Annual income (£)</label><input name="annual_income" type="number" value="55000"></div>
  <div class="flex flex-col gap-2 pt-4 text-sm">
   <label class="flex gap-2 items-center text-gray-200"><input type="checkbox" name="has_guarantor" class="w-4">I can offer a guarantor</label>
   <label class="flex gap-2 items-center text-gray-200"><input type="checkbox" name="passes_referencing" class="w-4" checked>I'd pass referencing (no CCJs)</label>
   <label class="flex gap-2 items-center text-gray-200"><input type="checkbox" name="has_pets" class="w-4">I have a pet</label>
  </div>
  <button class="col-span-2 mt-3 bg-emerald-400 text-black font-bold rounded-xl py-3">Start swiping →</button>
 </form>
</main>

<main id="swipe" class="view hidden max-w-md mx-auto p-4">
 <div id="deck" class="relative h-[560px]"></div>
 <div class="flex justify-center gap-6 mt-5">
  <button id="btn-nope" class="w-16 h-16 rounded-full bg-[#1b1f27] text-3xl shadow-lg">✕</button>
  <button id="btn-like" class="w-16 h-16 rounded-full bg-emerald-400 text-black text-3xl shadow-lg">♥</button>
 </div>
 <p class="text-center text-xs text-gray-500 mt-3">Swipe right to like. A match needs the landlord's rules to pass too.</p>
</main>

<main id="matches" class="view hidden max-w-xl mx-auto p-5">
 <h2 class="text-2xl font-black mb-3">Your matches</h2><div id="mlist" class="grid gap-3"></div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50">
 <div class="bg-[#1b1f27] rounded-3xl p-8 max-w-sm w-full text-center">
  <div class="text-6xl mb-2" id="m-emoji">🎉</div><h3 class="text-2xl font-black" id="m-title">It's a match!</h3>
  <p class="text-gray-400 text-sm mt-2" id="m-body"></p>
  <div class="flex gap-2 mt-5"><button id="m-chat" class="flex-1 bg-emerald-400 text-black font-bold rounded-xl py-2">Message landlord</button><button id="m-close" class="flex-1 bg-white/10 rounded-xl py-2">Keep swiping</button></div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s); let renterId=null, deck=[], maps={}, matchCount=0;
fetch('/api/meta').then(r=>r.json()).then(m=>{$('#ranker').textContent=m.ranker==='lightgbm'?'LightGBM ranker':'v1 ranker';$('#rentmonth').textContent=m.rent_month;});
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.add('hidden'));$('#'+v).classList.remove('hidden');if(v==='matches')loadMatches();}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#pform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const p={name:f.get('name'),budget:+f.get('budget'),bedrooms:+f.get('bedrooms'),work_postcode:f.get('work_postcode'),max_commute_km:+f.get('max_commute_km'),annual_income:+f.get('annual_income'),has_guarantor:!!f.get('has_guarantor'),passes_referencing:!!f.get('passes_referencing'),has_pets:!!f.get('has_pets'),weights:{transport:+f.get('w_transport'),safety:+f.get('w_safety'),green:+f.get('w_green'),energy:+f.get('w_energy')}};
 const r=await fetch('/api/renters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(r=>r.json());renterId=r.renter_id;show('swipe');await refill();};
async function refill(){if(deck.length>3)return;const more=await fetch(`/api/renters/${renterId}/deck?n=8`).then(r=>r.json());const have=new Set(deck.map(d=>d.id));deck.push(...more.filter(m=>!have.has(m.id)));render();}
const gbp=n=>'£'+n.toLocaleString();
function render(){const d=$('#deck');d.innerHTML='';deck.slice(0,3).reverse().forEach((l,i,arr)=>{const top=i===arr.length-1;const el=document.createElement('div');el.className='card';el.style.transform=`scale(${1-(arr.length-1-i)*.04}) translateY(${(arr.length-1-i)*10}px)`;el.dataset.id=l.id;
 el.innerHTML=`<div class="h-[52%]" id="map-${l.id}"></div>
 <div class="p-4"><div class="flex justify-between items-baseline"><div class="text-2xl font-black">${gbp(l.rent)}<span class="text-sm font-normal text-gray-400">/mo</span></div><div class="text-sm text-gray-300">${l.bedrooms===0?'Studio':l.bedrooms+' bed'} · ${l.type_name} · ${Math.round(l.tfarea)} m²</div></div>
 <div class="text-gray-300 mt-1">${l.area_label}</div>
 <div class="flex flex-wrap gap-1.5 mt-3"><span class="chip">EPC ${l.epc}</span><span class="chip">Built ${l.age_band}</span><span class="chip">🚇 ${l.transport_score}/10</span><span class="chip">🛡 ${l.safety_score}/10</span><span class="chip">🌳 ${l.environment_score}/10</span>${l.commute_km!=null?`<span class="chip">🧭 ${l.commute_km} km to work</span>`:''}${l.furnished?'<span class="chip">Furnished</span>':''}${l.pet_fee>=0?`<span class="chip">🐾 pets ok${l.pet_fee?' +£'+l.pet_fee:''}</span>`:'<span class="chip">🐾 no pets</span>'}</div>
 <div class="mt-3 text-xs text-gray-500">Landlord asks: income ≥ ${l.min_income_multiple}× rent${l.referencing_required?' · referencing':''}${l.guarantor_accepted?' · guarantor ok':''} · <span class="${l.eligible?'text-emerald-400':'text-amber-400'}">${l.eligible?'you qualify':'you may not qualify ('+l.block_reason+')'}</span></div></div>
 <div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div>`;d.appendChild(el);
 setTimeout(()=>{if(maps[l.id])return;const m=L.map('map-'+l.id,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false}).setView([l.lat,l.lon],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{className:'dark-tiles'}).addTo(m);L.circle([l.lat,l.lon],{radius:160,color:'#34d399',fillOpacity:.25}).addTo(m);maps[l.id]=m;},0);
 if(top)attachDrag(el,l);});}
function attachDrag(el,l){let sx=0,dx=0,down=false;el.onpointerdown=e=>{down=true;sx=e.clientX;el.classList.add('drag');el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.querySelector('.like').style.opacity=Math.min(1,dx/80);el.querySelector('.nope').style.opacity=Math.min(1,-dx/80)};
 el.onpointerup=()=>{down=false;el.classList.remove('drag');if(dx>110)decide(true);else if(dx<-110)decide(false);else{el.style.transform='';el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}dx=0};}
async function decide(liked){const l=deck.shift();const el=$('#deck .card:last-child');if(el){el.style.transform=`translateX(${liked?600:-600}px) rotate(${liked?25:-25}deg)`;el.style.opacity=0}
 const r=await fetch(`/api/renters/${renterId}/swipes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listing_id:l.id,liked})}).then(r=>r.json());
 if(liked){if(r.matched){matchCount++;$('#mcount').textContent=matchCount;$('#m-emoji').textContent='🎉';$('#m-title').textContent="It's a match!";$('#m-body').textContent=`You liked the ${l.bedrooms===0?'studio':l.bedrooms+'-bed'} in ${l.outcode} and you pass the landlord's rules. ${gbp(l.rent)}/mo.`;}
  else{$('#m-emoji').textContent='🚪';$('#m-title').textContent='Liked, but not a match';$('#m-body').textContent=`The landlord's rules block this one: ${({income:'income below their multiple of rent',guarantor:'they do not accept guarantors',referencing:'referencing required',pets:'no pets'})[r.block_reason]||r.block_reason}.`}
  $('#modal').classList.remove('hidden')}
 setTimeout(()=>{render();refill()},250)}
$('#btn-like').onclick=()=>decide(true);$('#btn-nope').onclick=()=>decide(false);$('#m-close').onclick=()=>$('#modal').classList.add('hidden');$('#m-chat').onclick=()=>{alert('Chat is a stub for the demo.');};
document.addEventListener('keydown',e=>{if($('#swipe').classList.contains('hidden'))return;if(e.key==='ArrowRight')decide(true);if(e.key==='ArrowLeft')decide(false)});
async function loadMatches(){const ms=await fetch(`/api/renters/${renterId}/matches`).then(r=>r.json());$('#mlist').innerHTML=ms.length?ms.map(l=>`<div class="rounded-2xl p-4 ${l.matched?'bg-emerald-400/10 border border-emerald-400/30':'bg-white/5'}"><div class="flex justify-between"><b>${l.matched?'✅ Match':'🚪 Blocked: '+l.block_reason}</b><span>${gbp(l.rent)}/mo</span></div><div class="text-sm text-gray-300">${l.bedrooms===0?'Studio':l.bedrooms+' bed'} ${l.type_name.toLowerCase()} · ${l.area_label}</div></div>`).join(''):'<p class="text-gray-500">No likes yet.</p>'}
</script></body></html>
