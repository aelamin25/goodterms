<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoodTerms · landlord and renter, live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ed;--ink:#17171a;--mute:#6b675f;--accent:#c2532a;--line:#d9d6cf}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 16px 12px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:18px}
.wordmark{font-weight:800;letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.01em}h1 em{color:var(--accent);font-style:italic}
.sub{margin:2px 0 0;font-size:15px;color:var(--mute);max-width:620px}
.stage{display:flex;gap:56px;align-items:flex-start;justify-content:center;transform-origin:top center}
.p{display:flex;flex-direction:column;align-items:center;gap:12px;width:412px}
.who{display:flex;align-items:center;gap:10px;height:30px}
.chip{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--ink);color:#fff}
.chip.r{background:var(--accent)}
.name{font-weight:700;font-size:17px;min-width:0}
.device{position:relative;width:412px;height:884px;background:#101012;border-radius:58px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.22),0 2px 0 rgba(255,255,255,.15) inset,0 0 0 2px #2a2a2e}


.device .btn{position:absolute;background:#2a2a2e;border-radius:3px}.device .btn.l{left:-3px;width:3px}.device .btn.r{right:-3px;width:3px;top:220px;height:90px}
iframe{display:block;width:390px;height:862px;border:0;border-radius:48px;background:#fff}
.steps{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);height:20px}
.steps b{color:var(--ink);font-weight:600}.steps i{font-style:normal;opacity:.5}
footer{margin-top:14px;font-size:12px;color:var(--mute);text-align:center}
footer a{color:inherit}
@media (max-width:900px){body{overflow:auto}.wrap{padding:12px 0}header{padding:0 16px}h1{font-size:30px}.stage{flex-direction:column;gap:28px;align-items:center}.device{width:min(412px,100vw);height:auto;border-radius:40px}iframe{width:100%;height:80vh;border-radius:32px}.steps{display:none}}
</style></head>
<body><div class="wrap">
<header>
 <div class="wordmark">GoodTerms</div>
 <h1>One landlord. One renter. <em>Live.</em></h1>
</header>
<div class="stage" id="stage">
 <div class="p">
  <div class="who"><span class="chip">Landlord</span><span class="name" id="n0"></span></div>
  <div class="device"><span class="btn l" style="top:150px;height:34px"></span><span class="btn l" style="top:200px;height:66px"></span><span class="btn l" style="top:280px;height:66px"></span><span class="btn r"></span><iframe title="Landlord phone" src="/?role=landlord&name=Hassan&demo=1&v=8"></iframe></div>
 </div>
 <div class="p">
  <div class="who"><span class="chip r">Renter</span><span class="name" id="n1"></span></div>
  <div class="device"><span class="btn l" style="top:150px;height:34px"></span><span class="btn l" style="top:200px;height:66px"></span><span class="btn l" style="top:280px;height:66px"></span><span class="btn r"></span><iframe title="Renter phone" src="/?role=renter&name=Sam&demo=1&v=9"></iframe></div>
 </div>
</div>
</div>
<script>
window.addEventListener('message',e=>{const fr=[...document.querySelectorAll('iframe')];const i=fr.findIndex(f=>f.contentWindow===e.source);if(i<0||!e.data)return;document.getElementById('n'+i).textContent=e.data.name||''});
// Fit both phones on whatever screen this is projected on.
function fit(){const st=document.getElementById('stage');if(matchMedia('(max-width:900px)').matches){st.style.transform='';return}
 const avail=innerHeight-st.getBoundingClientRect().top-70, need=884+30+24, s=Math.min(1,avail/need,(innerWidth-32)/(412*2+56));
 st.style.transform=`scale(${s})`;st.style.marginBottom=`${(s-1)*need}px`}
addEventListener('resize',fit);addEventListener('load',fit);fit();
</script></body></html>
