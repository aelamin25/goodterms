<!doctype html><html><head><meta charset="utf-8"><title>GoodTerms · two-phone demo</title>
<style>body{margin:0;background:#f4f2ed;font-family:Inter,ui-sans-serif,system-ui;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:24px}
.p{display:flex;flex-direction:column;align-items:center;gap:10px}.p h3{margin:0;font-weight:800;letter-spacing:-.02em}
iframe{width:390px;height:844px;border:1px solid #d9d6cf;border-radius:44px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.12)}</style></head>
<body><div class="p"><h3 id="h0">Phone 1</h3><iframe src="/?v=3"></iframe></div><div class="p"><h3 id="h1">Phone 2</h3><iframe src="/?v=3"></iframe></div>
<script>window.addEventListener('message',e=>{const fr=[...document.querySelectorAll('iframe')];const i=fr.findIndex(f=>f.contentWindow===e.source);if(i<0||!e.data)return;document.getElementById('h'+i).textContent=`${e.data.name||'Phone '+(i+1)} · ${e.data.role==='landlord'?'landlord':'renter'}`})</script></body></html>
